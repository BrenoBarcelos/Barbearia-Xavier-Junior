<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento Formulário | Barbearia Xavier Junior</title>
    <link
      rel="shortcut icon"
      href="images/Logo-BXJ.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;600;700&family=Raleway:ital,wght@0,300;0,400;1,300&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background-image: none; 
      }
      .booking-page-container {
        background: var(--dark2);
        width: 100%;
        max-width: 500px;
        padding: 40px;
        border: 1px solid rgba(201, 162, 39, 0.3);
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        margin-bottom: 24px;
        color: var(--gray);
        text-decoration: none;
        font-family: "Oswald", sans-serif;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 2px;
        transition: color 0.3s;
      }
      .back-link:hover {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div class="booking-page-container">
      <a href="index.html" class="back-link">← Voltar para o Início</a>

      <div class="section-tag">Reservar Horário</div>
      <h2 class="modal-title">Agendamento Online</h2>

      <form id="bookingForm">
        <div class="form-group">
          <label for="nome">Seu Nome</label>
          <input type="text" id="nome" placeholder="Ex: João Silva" required />
        </div>

        <div class="form-group">
          <label for="servico">Serviço Desejado</label>
          <select id="servico" required>
            <option value="" disabled selected>Selecione um serviço</option>
            <option value="Corte Social">Corte Social</option>
            <option value="Barba Completa">Barba Completa</option>
            <option value="Pigmentação">Corte + Barba</option>
            <option value="Combo Premium">Combo Premium</option>
            <option value="Sobrancelha">Sobrancelha</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" required />
          </div>
          <div class="form-group">
            <label for="horario">Horário</label>
            <input type="time" id="horario" required />
          </div>
        </div>

        <button
          type="submit"
          class="btn-primary"
          style="width: 100%; margin-top: 20px"
        >
          Confirmar via WhatsApp
        </button>
      </form>
    </div>
  </body>
</html>
